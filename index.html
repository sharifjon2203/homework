<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>

  <form action="http://localhost:3000/products" method="post">
    <label for="product">name</label>
    <input type="text" placeholder="Product name" id="product" name="name" required>
    <br>
    <label for="product_date">Date</label>
    <input type="date" placeholder="Product year" id="product_date" name="date" required>
    <br>
    <label for="product_price">Price</label>
    <input type="number" placeholder="Product Price" id="product_price" name="price" required min="0">

    <input type="submit" value="Send">
  </form>

</body>

</html>
