<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App (Community)</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <main>
    <div class="container">
      <div class="todo-container">
        <div class="todo-input">
          <div class="todo-input_box">
            <input type="text" name="task" id="task-input" placeholder="Add a new task" required>
            <button id="add-task_btn"><img src="./images/Vector.png" alt="plus"></button>
          </div>

        </div>
        <div class="todo-task_list">
          <h3>Tasks to do - <span id="task-count">1</span> </h3>
          <div class="task-list_container">


          </div>
        </div>
        <div class="todo-done-task_list">
          <h3>Done - <span id="done-task-count">1</span></h3>
          <div class="done-task-container">
            <div>
              <del>To study React fundamentals</del>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="./js/main.js"></script>
</body>

</html>
